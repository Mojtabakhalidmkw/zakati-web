<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ذكاتي - ديوان الزكاة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
        .islamic-gradient {
            background: linear-gradient(135deg, #065f46 0%, #047857 50%, #064e3b 100%);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Toast Notification System -->
    <div id="toast-container" class="fixed top-5 left-5 z-50 flex flex-col gap-2"></div>

    <!-- Receipt Modal -->
    <div id="receipt-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border-t-8 border-emerald-600 animate-fade-in">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                    <i class="fa-solid fa-receipt"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-900">إيصال سداد زكاة رسمي</h3>
                <p class="text-xs text-slate-500">ديوان الزكاة - منصة ذكاتي الإلكترونية</p>
            </div>
            <div id="receipt-content" class="space-y-3 text-sm text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6">
                <!-- Dynamic Content -->
            </div>
            <div class="flex gap-3">
                <button onclick="window.print()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition shadow-md shadow-emerald-600/20">
                    <i class="fa-solid fa-print ml-2"></i> طباعة الإيصال
                </button>
                <button onclick="closeReceiptModal()" class="px-5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2.5 rounded-xl transition">
                    إغلاق
                </button>
            </div>
        </div>
    </div>

    <!-- App Wrapper -->
    <div id="app" class="flex-1 flex flex-col"></div>

    <script>
        // --- 1. Default Data & Initial State Setup ---
        const DEFAULT_PRICES = {
            'الفول السوداني': 160000,
            'الصمغ العربي': 350000,
            'التسالي': 190000,
            'مخلفات الصمغ': 55000,
            'مخلفات الفول السوداني': 45000
        };

        const DEFAULT_ACCOUNTS = [
            { accNo: '1234', pin: '1234', name: 'مدير النظام (Admin)', balance: 12000000, type: 'admin', inventory: {} },
            { accNo: '2001', pin: '1234', name: 'شركة الرهد الزراعية المحدودة', balance: 6500000, type: 'company', inventory: { 'الفول السوداني': 25, 'الصمغ العربي': 10 } },
            { accNo: '2002', pin: '1234', name: 'شركة النيلين للتجارة والصادرات', balance: 9000000, type: 'company', inventory: { 'التسالي': 18, 'مخلفات الفول السوداني': 30, 'مخلفات الصمغ': 12 } }
        ];

        function getStoredData(key, fallback) {
            const data = localStorage.getItem('zakati_' + key);
            return data ? JSON.parse(data) : fallback;
        }

        function setStoredData(key, value) {
            localStorage.setItem('zakati_' + key, JSON.stringify(value));
        }

        let accounts = getStoredData('accounts', DEFAULT_ACCOUNTS);
        let prices = getStoredData('prices', DEFAULT_PRICES);
        let transactions = getStoredData('transactions', []);
        let currentUser = null;

        // --- Toast Notifications ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-amber-600';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';
            
            toast.className = `${bgClass} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-3 transform translate-y-2 opacity-0 transition-all duration-300 font-semibold text-sm`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // --- Router ---
        function render() {
            const app = document.getElementById('app');
            if (!currentUser) {
                app.innerHTML = renderLoginView();
            } else if (currentUser.type === 'admin' || currentUser.accNo === '1234') {
                app.innerHTML = renderAdminDashboard();
            } else {
                app.innerHTML = renderCompanyDashboard();
            }
        }

        // --- 1. Login View ---
        function renderLoginView() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 islamic-gradient relative overflow-hidden">
                    <div class="absolute -top-24 -right-24 w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
                    <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-teal-500/20 rounded-full blur-3xl pointer-events-none"></div>

                    <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl max-w-md w-full p-8 border border-white/25 relative z-10">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-emerald-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-xl shadow-emerald-600/30">
                                <i class="fa-solid fa-scale-balanced"></i>
                            </div>
                            <h1 class="text-3xl font-black text-slate-950 tracking-tight">منصة ذكاتي</h1>
                            <p class="text-sm text-slate-500 mt-1">البوابة الرقمية لديوان الزكاة - المحاصيل الزراعية</p>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-5">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-2">رقم حساب الشركة / الأدمن</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400">
                                        <i class="fa-solid fa-id-card"></i>
                                    </span>
                                    <input type="text" id="login-acc" required placeholder="مثال: 2001 أو 1234"
                                        class="w-full pr-11 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition text-sm">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-2">كلمة السر</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>
                                    <input type="password" id="login-pin" required placeholder="أدخل كلمة السر"
                                        class="w-full pr-11 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition text-sm">
                                </div>
                            </div>

                            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                                <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
                            </button>
                        </form>

                        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                            <p class="text-xs text-slate-500 mb-3 font-semibold">حسابات تجريبية للاختبار السريع:</p>
                            <div class="flex flex-wrap justify-center gap-2">
                                <button onclick="quickLogin('1234', '1234')" class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1.5 rounded-lg hover:bg-emerald-200 transition font-bold">
                                    أدمن (1234 / 1234)
                                </button>
                                <button onclick="quickLogin('2001', '1234')" class="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-200 transition font-medium">
                                    شركة 2001
                                </button>
                                <button onclick="quickLogin('2002', '1234')" class="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-200 transition font-medium">
                                    شركة 2002
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function quickLogin(acc, pin) {
            document.getElementById('login-acc').value = acc;
            document.getElementById('login-pin').value = pin;
        }

        function handleLogin(e) {
            e.preventDefault();
            const accNo = document.getElementById('login-acc').value.trim();
            const pin = document.getElementById('login-pin').value.trim();

            const found = accounts.find(a => a.accNo === accNo && a.pin === pin);
            if (found) {
                currentUser = found;
                showToast(`أهلاً بك، ${found.name}`, 'success');
                render();
            } else {
                showToast('رقم الحساب أو كلمة السر غير صحيحة', 'error');
            }
        }

        function logout() {
            currentUser = null;
            showToast('تم تسجيل الخروج بنجاح', 'info');
            render();
        }

        // --- 2. Company Dashboard ---
        let companyTab = 'calc'; // 'calc', 'transfer', 'pay', 'history', 'permit'

        function renderCompanyDashboard() {
            // Keep user session updated
            currentUser = accounts.find(a => a.accNo === currentUser.accNo);

            return `
                <div class="min-h-screen flex flex-col bg-slate-50">
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-emerald-600 text-white rounded-xl flex items-center justify-center text-xl shadow-md">
                                    <i class="fa-solid fa-building"></i>
                                </div>
                                <div>
                                    <h2 class="font-bold text-slate-900 text-base sm:text-lg">${currentUser.name}</h2>
                                    <p class="text-xs text-slate-500">رقم الحساب: <span class="font-mono font-bold text-emerald-600">${currentUser.accNo}</span></p>
                                </div>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="hidden sm:block text-left bg-emerald-50 px-4 py-2 rounded-xl border border-emerald-100">
                                    <span class="text-xs text-emerald-700 block font-semibold">الرصيد الزكوي المتاح</span>
                                    <span class="font-bold text-emerald-900 text-base">${Object.values(currentUser.inventory || {}).reduce((sum, q) => sum + Number(q || 0), 0).toLocaleString()} قنطار</span>
                                </div>
                                <button onclick="logout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2.5 rounded-xl transition text-sm font-semibold flex items-center gap-2">
                                    <i class="fa-solid fa-right-from-bracket"></i> خروج
                                </button>
                            </div>
                        </div>
                    </header>

                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
                        <!-- Navigation Tabs -->
                        <div class="flex overflow-x-auto gap-2 mb-8 bg-white p-2 rounded-2xl shadow-sm border border-slate-200">
                            <button onclick="setCompanyTab('calc')" class="flex-1 min-w-[150px] py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition ${companyTab === 'calc' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20' : 'text-slate-600 hover:bg-slate-100'}">
                                <i class="fa-solid fa-calculator"></i> حساب زكاة المحاصيل
                            </button>
                            <button onclick="setCompanyTab('transfer')" class="flex-1 min-w-[150px] py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition ${companyTab === 'transfer' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20' : 'text-slate-600 hover:bg-slate-100'}">
                                <i class="fa-solid fa-right-left"></i> تحويل زكاة صنف
                            </button>
                            <button disabled title="متوقف مؤقتاً" class="flex-1 min-w-[170px] py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 bg-slate-100 text-slate-400 cursor-not-allowed opacity-80">
                                <i class="fa-solid fa-ban"></i> شراء زكاة (متوقف مؤقتاً)
                            </button>
                            <button onclick="setCompanyTab('history')" class="flex-1 min-w-[150px] py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition ${companyTab === 'history' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20' : 'text-slate-600 hover:bg-slate-100'}">
                                <i class="fa-solid fa-clock-rotate-left"></i> سجل العمليات
                            </button>
                            <button onclick="setCompanyTab('permit')" class="flex-1 min-w-[180px] py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition ${companyTab === 'permit' ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20' : 'text-slate-600 hover:bg-slate-100'}">
                                <i class="fa-solid fa-truck-fast"></i> تصريح مرور مؤقت
                            </button>
                        </div>

                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8">
                            ${companyTab === 'calc' ? renderCropCalculator() : ''}
                            ${companyTab === 'transfer' ? renderTransferForm() : ''}
                            ${companyTab === 'pay' ? renderPaymentPaused() : ''}
                            ${companyTab === 'history' ? renderCompanyHistory() : ''}
                            ${companyTab === 'permit' ? renderPermitForm() : ''}
                        </div>
                    </main>
                </div>
            `;
        }

        function setCompanyTab(tab) {
            companyTab = tab;
            render();
        }

        // Service 1: Crop Zakat Calculator (الفول السوداني، الصمغ العربي، التسالي، مخلفات الصمغ، مخلفات الفول السوداني)
        function renderCropCalculator() {
            let options = '';
            for (let crop in prices) {
                options += `<option value="${crop}">${crop} (قيمة القنطار: 60,000 جنيه زكاة)</option>`;
            }

            return `
                <div class="max-w-2xl mx-auto">
                    <div class="mb-6 border-b border-slate-100 pb-4">
                        <h3 class="text-xl font-bold text-slate-900">حساب زكاة المحاصيل الزراعية والمخلفات</h3>
                        <p class="text-sm text-slate-500">اختر المحصول المطلوب وأدخل الكمية لحساب إجمالي القيمة وقيمة الزكاة الشرعية (2.5%).</p>
                    </div>

                    <form onsubmit="calculateCropZakat(event)" class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">اختر المحصول</label>
                            <select id="calc-crop" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-semibold">
                                ${options}
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">الكمية (بالقنطار)</label>
                            <input type="number" id="calc-qty" required min="0.01" step="any" placeholder="أدخل الكمية المتوفرة"
                                class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                        </div>

                        <div id="calc-result" class="hidden bg-emerald-50 border border-emerald-200 p-5 rounded-2xl space-y-2">
                            <div class="flex justify-between text-sm text-emerald-800">
                                <span>القيمة الزكوية التقديرية:</span>
                                <span id="res-total" class="font-bold">0 جنيه</span>
                            </div>
                            <div class="flex justify-between text-base text-emerald-900 font-bold pt-2 border-t border-emerald-200">
                                <span>قيمة الزكاة التقديرية:</span>
                                <span id="res-zakat" class="text-lg">0 جنيه</span>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-calculator"></i> احسب قيمة الزكاة الآن
                        </button>
                    </form>
                </div>
            `;
        }

        function calculateCropZakat(e) {
            e.preventDefault();
            const crop = document.getElementById('calc-crop').value;
            const qty = parseFloat(document.getElementById('calc-qty').value);
            const total = qty * 60000;
            const zakat = total;

            document.getElementById('res-total').innerText = total.toLocaleString() + ' جنيه';
            document.getElementById('res-zakat').innerText = zakat.toLocaleString() + ' جنيه';
            document.getElementById('calc-result').classList.remove('hidden');
            showToast('تم حساب الزكاة بنجاح', 'success');
        }

        // Service 2: Transfer Zakat of a specific crop to another account with the SAME crop category condition
        function renderTransferForm() {
            let myInventoryOptions = '';
            if (currentUser.inventory) {
                for (let c in currentUser.inventory) {
                    if (currentUser.inventory[c] > 0) {
                        myInventoryOptions += `<option value="${c}">${c} (الرصيد المتاح: ${currentUser.inventory[c]} قنطار)</option>`;
                    }
                }
            }

            let compOptions = '';
            accounts.filter(a => a.type === 'company' && a.accNo !== currentUser.accNo).forEach(comp => {
                compOptions += `<option value="${comp.accNo}">${comp.name} (حساب: ${comp.accNo})</option>`;
            });

            return `
                <div class="max-w-2xl mx-auto">
                    <div class="mb-6 border-b border-slate-100 pb-4">
                        <h3 class="text-xl font-bold text-slate-900">تحويل زكاة صنف إلى حساب آخر</h3>
                        <p class="text-sm text-slate-500">يتيح لك هذا الخيار تحويل كمية زكاة صنف معين من مخزون شركتك إلى حساب شركة أخرى بشرط أن يكون لنفس الصنف حصراً.</p>
                    </div>

                    <form onsubmit="handleTransfer(event)" class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">اختر الصنف المراد تحويله من مخزونك</label>
                            <select id="trans-crop" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-semibold">
                                <option value="">-- اختر الصنف --</option>
                                ${myInventoryOptions}
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">الكمية المراد تحويلها (بالقنطار)</label>
                            <input type="number" id="trans-qty" required min="0.01" step="any" placeholder="أدخل الكمية"
                                class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">رقم حساب الشركة المستلمة</label>
                            <select id="trans-dest" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-semibold">
                                <option value="">-- اختر الشركة المستلمة --</option>
                                ${compOptions}
                            </select>
                        </div>

                        <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl text-xs text-blue-800">
                            <i class="fa-solid fa-circle-info ml-1"></i> سيتم التحقق تلقائياً من تطابق الصنف وتوفر رصيد كافٍ في مخزونك للكمية المطلوبة.
                        </div>

                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-right-left"></i> تنفيذ عملية التحويل
                        </button>
                    </form>
                </div>
            `;
        }

        function handleTransfer(e) {
            e.preventDefault();
            const crop = document.getElementById('trans-crop').value;
            const qty = parseFloat(document.getElementById('trans-qty').value);
            const destAccNo = document.getElementById('trans-dest').value;

            if (!currentUser.inventory || currentUser.inventory[crop] < qty) {
                showToast('الكمية المتاحة لديك من هذا الصنف غير كافية لإتمام التحويل', 'error');
                return;
            }

            const destAccount = accounts.find(a => a.accNo === destAccNo);
            if (!destAccount) {
                showToast('حساب الشركة المستلمة غير موجود', 'error');
                return;
            }

            // Perform Inventory Transfer
            currentUser.inventory[crop] -= qty;
            if (!destAccount.inventory) destAccount.inventory = {};
            destAccount.inventory[crop] = (destAccount.inventory[crop] || 0) + qty;

            // Log Transaction
            const tx = {
                id: 'TRX-' + Math.floor(100000 + Math.random() * 900000),
                type: 'تحويل زكاة صنف',
                from: currentUser.accNo,
                to: destAccNo,
                crop: crop,
                qty: qty,
                date: new Date().toLocaleString('ar-SA')
            };
            transactions.push(tx);

            setStoredData('accounts', accounts);
            setStoredData('transactions', transactions);

            showToast(`تم تحويل ${qty} قنطار من صنف ${crop} بنجاح إلى الحساب ${destAccNo}`, 'success');
            render();
        }

        // Service 3: Pay Zakat for any of the listed crop items
        function renderPaymentForm() {
            let options = '';
            for (let crop in prices) {
                options += `<option value="${crop}">${crop} (قيمة القنطار: 60,000 جنيه زكاة)</option>`;
            }

            return `
                <div class="max-w-2xl mx-auto">
                    <div class="mb-6 border-b border-slate-100 pb-4">
                        <h3 class="text-xl font-bold text-slate-900">دفع زكاة الأصناف</h3>

        function handlePayment(e) {
            e.preventDefault();
            showToast('خدمة شراء الزكاة متوقفة مؤقتاً', 'info'); return;
            const crop = document.getElementById('pay-crop').value;
            const qty = parseFloat(document.getElementById('pay-qty').value);
            const unitPrice = prices[crop] || 0;
            const totalVal = qty * unitPrice;
            const zakatDue = totalVal * 0.025;

            if (currentUser.balance < zakatDue) {
                showToast(`رصيدك النقدي الحالي (${Number(currentUser.balance).toLocaleString()} جنيه) لا يكفي لسداد قيمة الزكاة (${zakatDue.toLocaleString()} جنيه)`, 'error');
                return;
            }

            // Deduct from company balance & credit admin/diwan
            currentUser.balance -= zakatDue;
            const adminAcc = accounts.find(a => a.accNo === '1234');
            if (adminAcc) adminAcc.balance += zakatDue;

            const tx = {
                id: 'PAY-' + Math.floor(100000 + Math.random() * 900000),
                type: 'دفع زكاة صنف',
                from: currentUser.accNo,
                to: 'ديوان الزكاة (1234)',
                crop: crop,
                qty: qty,
                amount: zakatDue,
                date: new Date().toLocaleString('ar-SA')
            };
            transactions.push(tx);

            setStoredData('accounts', accounts);
            setStoredData('transactions', transactions);

            showToast('تم سداد الزكاة بنجاح!', 'success');
            openReceiptModal(tx);
            render();
        }

            const rows = accounts.filter(a => a.type === 'company').map(a => {
                const inv = a.inventory || {};
                const items = Object.entries(inv).filter(([c,q]) => Number(q) > 0)
                    .map(([c,q]) => `${c}: ${q} قنطار`).join('، ') || 'لا يوجد رصيد زكوي';
                return `<tr class="border-b"><td class="p-3">${a.name}</td><td class="p-3">${items}</td></tr>`;
            }).join('');
            return `<div class="max-w-3xl mx-auto">
                <h3 class="text-xl font-bold mb-2">إضافة رصيد زكوي لصنف معين</h3>
                <p class="text-sm text-slate-500 mb-6">هذه الصلاحية متاحة لحساب الأدمن فقط. تُضاف الكمية إلى رصيد الشركة بالقنطار، ولا تُجرى أي إضافة مالية.</p>
                <form onsubmit="adminAddZakat(event)" class="grid sm:grid-cols-2 gap-4 bg-emerald-50 border border-emerald-200 p-5 rounded-2xl mb-8">
                    <div><label class="block text-sm font-bold mb-2">الشركة المستفيدة</label><select id="zakat-company" required class="w-full p-3 border rounded-xl bg-white">${companyOptions}</select></div>
                    <div><label class="block text-sm font-bold mb-2">الصنف</label><select id="zakat-crop" required class="w-full p-3 border rounded-xl bg-white">${cropOptions}</select></div>
                    <div><label class="block text-sm font-bold mb-2">الكمية المضافة (قنطار)</label><input id="zakat-qty" type="number" min="0.01" step="0.01" required class="w-full p-3 border rounded-xl bg-white" placeholder="أدخل عدد القناطير"></div>
                    <div class="flex items-end"><button class="w-full bg-emerald-800 text-white p-3 rounded-xl font-bold" type="submit">إضافة الرصيد الزكوي</button></div>
                </form>
                <h4 class="font-bold mb-3">أرصدة الشركات حسب الصنف</h4>
                <div class="overflow-x-auto"><table class="w-full text-right"><thead><tr class="bg-slate-100"><th class="p-3">الشركة</th><th class="p-3">الرصيد الزكوي</th></tr></thead><tbody>${rows}</tbody></table></div>
            </div>`;
        }

        function adminAddZakat(e) {
            e.preventDefault();
            if (!currentUser || currentUser.type !== 'admin' || currentUser.accNo !== '1234') {
                showToast('هذه العملية متاحة لحساب الأدمن فقط', 'error'); return;
            }
            const company = accounts.find(a => a.accNo === document.getElementById('zakat-company').value && a.type === 'company');
            const crop = document.getElementById('zakat-crop').value;
            const qty = Number(document.getElementById('zakat-qty').value);
            if (!company || !Number.isFinite(qty) || qty <= 0 || !prices.hasOwnProperty(crop)) {
                showToast('تحقق من الشركة والصنف والكمية', 'error'); return;
            }
            if (!company.inventory) company.inventory = {};
            company.inventory[crop] = Number(company.inventory[crop] || 0) + qty;
            transactions.push({id:'ZKT-' + Math.floor(100000 + Math.random()*900000), type:'إضافة رصيد زكوي', from:'الأدمن (1234)', to:company.accNo, crop, qty, date:new Date().toLocaleString('ar-SA')});
            setStoredData('accounts', accounts); setStoredData('transactions', transactions);
            showToast(`تمت إضافة ${qty} قنطار من ${crop} إلى رصيد الشركة`, 'success');
            render();
        }

        function renderPermitForm() {
            const cropOptions = Object.keys(prices).map(c => `<option value="${c}">${c}</option>`).join('');
            const states = ['جميع ولايات السودان','الخرطوم','الجزيرة','القضارف','كسلا','البحر الأحمر','نهر النيل','الشمالية','النيل الأبيض','النيل الأزرق','سنار','النيل الأزرق','شمال كردفان','جنوب كردفان','غرب كردفان','شمال دارفور','جنوب دارفور','غرب دارفور','وسط دارفور','شرق دارفور'];
            const stateOptions = [...new Set(states)].map(st => `<option value="${st}">${st}</option>`).join('');
            return `<div class="max-w-3xl mx-auto">
                <h3 class="text-xl font-bold text-slate-900 mb-2">طلب تصريح مرور مؤقت للبضائع</h3>
                <p class="text-sm text-slate-500 mb-6">املأ بيانات الشحنة. مدة صلاحية التصريح ثابتة: 3 أيام من تاريخ الإصدار.</p>
                <form onsubmit="createPermit(event)" class="grid sm:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-bold mb-2">الصنف</label><select id="permit-crop" required class="w-full p-3 border rounded-xl bg-white">${cropOptions}</select></div>
                    <div><label class="block text-sm font-bold mb-2">الكمية (قنطار)</label><input id="permit-qty" type="number" min="0.01" step="0.01" required class="w-full p-3 border rounded-xl" placeholder="الكمية المراد تحريكها"></div>
                    <div><label class="block text-sm font-bold mb-2">الولاية المقصودة</label><select id="permit-state" required class="w-full p-3 border rounded-xl bg-white">${stateOptions}</select></div>
                    <div><label class="block text-sm font-bold mb-2">رقم الشاحنة</label><input id="permit-truck" required class="w-full p-3 border rounded-xl" placeholder="رقم اللوحة"></div>
                    <div><label class="block text-sm font-bold mb-2">اسم السائق</label><input id="permit-driver" required class="w-full p-3 border rounded-xl" placeholder="الاسم الكامل"></div>
                    <div><label class="block text-sm font-bold mb-2">تاريخ إصدار التصريح</label><input id="permit-date" type="date" required value="${new Date().toISOString().slice(0,10)}" class="w-full p-3 border rounded-xl"></div>
                    <div class="sm:col-span-2 bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-800"><i class="fa-solid fa-clock ml-1"></i> مدة الصلاحية: 3 أيام من تاريخ الإصدار، وتحسب نهاية الصلاحية تلقائياً.</div>
                    <div class="sm:col-span-2"><button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white p-3 rounded-xl font-bold"><i class="fa-solid fa-file-circle-check ml-2"></i> إنشاء التصريح واستخراجه كإيصال PDF</button></div>
                </form>
            </div>`;
        }

        function createPermit(e) {
            e.preventDefault();
            const crop = document.getElementById('permit-crop').value;
            const qty = Number(document.getElementById('permit-qty').value);
            const state = document.getElementById('permit-state').value;
            const truck = document.getElementById('permit-truck').value.trim();
            const driver = document.getElementById('permit-driver').value.trim();
            const issueDate = document.getElementById('permit-date').value;
            if (!issueDate || !Number.isFinite(qty) || qty <= 0 || !truck || !driver) {
                showToast('يرجى إكمال بيانات التصريح بصورة صحيحة', 'error'); return;
            }
            const end = new Date(issueDate + 'T23:59:59');
            end.setDate(end.getDate() + 3);
            const expiry = end.toISOString().slice(0,10);
            const permit = {id:'PRM-' + Math.floor(100000 + Math.random()*900000), type:'تصريح مرور مؤقت', from:currentUser.accNo, crop, qty, state, truck, driver, issueDate, expiry, date:new Date().toLocaleString('ar-SA')};
            transactions.push(permit);
            setStoredData('transactions', transactions);
            const w = window.open('', '_blank');
            if (!w) { showToast('يرجى السماح بالنوافذ المنبثقة لاستخراج الإيصال PDF', 'error'); return; }
            w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تصريح مرور ${permit.id}</title>
                <style>body{font-family:Arial,sans-serif;padding:32px;color:#172033} .receipt{max-width:700px;margin:auto;border:2px solid #166534;padding:28px;border-radius:12px}h1{text-align:center;color:#166534;font-size:24px}p{text-align:center;color:#555}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:12px 0;gap:20px}.notice{margin-top:20px;padding:12px;background:#fef3c7;border:1px solid #f59e0b;border-radius:8px}.foot{text-align:center;margin-top:28px;font-size:12px;color:#666}@media print{button{display:none}body{padding:0}.receipt{border:1px solid #333}}</style></head><body>
                <div class="receipt"><h1>منصة ذكاتي — تصريح مرور مؤقت</h1><p>إيصال بيانات حركة بضائع — ليس بديلاً عن التصاريح الرسمية الصادرة من الجهات المختصة</p>
                <div class="row"><strong>رقم التصريح</strong><span>${permit.id}</span></div>
                <div class="row"><strong>الشركة</strong><span>${currentUser.name} (${currentUser.accNo})</span></div>
                <div class="row"><strong>الصنف</strong><span>${crop}</span></div>
                <div class="row"><strong>الكمية</strong><span>${qty.toLocaleString()} قنطار</span></div>
                <div class="row"><strong>الولاية المقصودة</strong><span>${state}</span></div>
                <div class="row"><strong>رقم الشاحنة</strong><span>${truck}</span></div>
                <div class="row"><strong>اسم السائق</strong><span>${driver}</span></div>
                <div class="row"><strong>تاريخ الإصدار</strong><span>${issueDate}</span></div>
                <div class="row"><strong>صالح حتى</strong><span>${expiry}</span></div>
                <div class="notice">مدة الصلاحية ثلاثة أيام من تاريخ الإصدار. يجب التحقق من المتطلبات والتصاريح الرسمية لدى الجهات المختصة قبل تحريك الشحنة.</div>
                <div class="foot">تم إنشاء هذا الإيصال إلكترونياً بواسطة منصة ذكاتي.</div><button onclick="window.print()">طباعة / حفظ PDF</button></div></body></html>`);
            w.document.close();
            w.focus();
            w.print();
            showToast('تم إنشاء التصريح وإضافته إلى سجل العمليات', 'success');
            render();
        }

        // Initialize App
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
